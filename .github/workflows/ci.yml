name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # 멈춘 실행을 끊는 안전장치다. 커버리지를 켠 전체 검사가 느린 러너에서
    # 20분 안에 끝나지 않는 일이 생겨, 정상 실행이 잘리지 않게 여유를 둔다.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dart: ['3.11.0', '3.13.3']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: ${{ matrix.dart }}
      - run: dart pub get
      - name: Run dart format --output=none --set-exit-if-changed .
        run: |
          if dart format --output=none --set-exit-if-changed .; then
            exit 0
          else
            status=$?
            # 진단 실패가 원래 포맷 검사의 종료 코드를 바꾸지 않게 한다.
            dart format . || true
            printf '\nFormatting diff (up to 32768 bytes):\n'
            git diff -- . | head -c 32768 || true
            printf '\n'
            exit "$status"
          fi
      - run: dart analyze
      - name: VS Code extension checks
        run: |
          node --check editors/vscode/extension.js
          node editors/vscode/test/mapper.test.js
          node editors/vscode/test/executable.test.js
          node editors/vscode/test/extension.test.js
      - name: Analysis plugin checks
        working-directory: editors/analysis_plugin
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Tests, coverage and isolated activation
        run: tool/check-coverage.sh
      - run: tool/verify-false-positive-corpus.sh
      - run: tool/check-analyzer-boundary.sh
      - run: tool/verify-cli-contract.sh
      - run: dart pub publish --dry-run

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dart: ['3.11.0', '3.13.3']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: ${{ matrix.dart }}
      - name: Install analyzer-boundary scanner
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze
      - name: Tests, coverage and isolated activation
        run: tool/check-coverage.sh
      - run: tool/verify-false-positive-corpus.sh
      - run: tool/check-analyzer-boundary.sh
      - run: tool/verify-cli-contract.sh
      - run: dart pub publish --dry-run

name: analyzer-freshness

# analyzer 제약은 검증된 마이너 집합만 허용한다(doc/DECISION-analyzer.md).
# CI는 커밋된 pubspec.lock으로 해석하므로 새 analyzer 마이너가 나와도
# 계약 테스트가 스스로 울지 않는다. 이 스케줄 잡이 신선한 resolution으로
# 제약 안 최신 해석으로 전체 스위트를 돌린다. <14.6.0 밖의 마이너는 이 잡이
# 설치하지 않는다. 상한 확대는 별도 scratch checkout에서 오라클·전체 검증 후 제안한다.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.3
      - run: dart pub upgrade
      - run: dart test

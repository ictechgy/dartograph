name: analyzer-freshness

# analyzer 제약은 검증된 마이너 집합만 허용한다(doc/DECISION-analyzer.md).
# 저장소는 pubspec.lock을 커밋하지 않으므로 일반 CI의 `dart pub get`은 제약 안의
# 최신(현재 검증 집합의 상한 마이너)으로 해석한다. 그래서 일반 CI만으로는 두 가지를
# 알 수 없다. 검증 집합의 하한 마이너가 여전히 동작하는지, 그리고 상한 밖의 새
# 마이너가 나왔는지다. 이 예약 실행이 둘을 관측한다. PR 게이트가 아니며, 상한
# 확대는 별도 scratch checkout에서 오라클·전체 검증 후 제안한다.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.3
      - run: dart pub upgrade
      - run: dart test

  # 검증 집합의 하한 마이너로 전체 스위트를 돌린다. 전체 `pub downgrade`는 개발
  # 의존성(test 등)까지 SDK와 맞지 않는 최소 버전으로 내려 제품과 무관하게 테스트
  # 로딩이 실패하므로(SDK 3.13.3 실측) analyzer와 그 의존만 내린다.
  lowest-analyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.3
      - run: dart pub get
      - run: dart pub downgrade analyzer
      - name: Show the resolved analyzer
        run: jq -r '.packages[] | select(.name == "analyzer") | .rootUri' .dart_tool/package_config.json
      - run: dart analyze
      - run: dart test

  # 상한을 풀어 가장 새로운 analyzer로 해석한다. 그 버전이 검증 집합 밖이면 이
  # 예약 실행을 실패시켜 알린다 — 그렇지 않으면 새 마이너가 나와도 아무 잡도 그것을
  # 설치하지 않아 드러나지 않는다. 호환 여부는 같은 실행에서 관측만 한다(검증 범위
  # 계약 테스트는 이 버전을 거부하도록 설계됐으므로 이 관측에서만 뺀다). 관측이
  # 통과해도 검증 집합 확대를 뜻하지 않는다.
  unvalidated-analyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.3
      - name: Resolve the newest analyzer without the upper bound
        run: |
          printf 'dependency_overrides:\n  analyzer: any\n' > pubspec_overrides.yaml
          dart pub upgrade
      - name: Observe compatibility outside the validated range
        id: observe
        continue-on-error: true
        run: |
          rm test/index/analyzer_version_contract_test.dart
          dart analyze
          dart test
      - name: Fail when the newest analyzer is outside the validated range
        env:
          OBSERVATION: ${{ steps.observe.outcome }}
        run: |
          root_uri=$(jq -r '.packages[] | select(.name == "analyzer") | .rootUri' .dart_tool/package_config.json)
          version=${root_uri##*/analyzer-}
          upper=$(sed -nE "s/^  analyzer: '>=[0-9.]+ <([0-9.]+)'$/\1/p" pubspec.yaml)
          if [ -z "$upper" ]; then
            echo "::error::could not read the analyzer upper bound from pubspec.yaml"
            exit 1
          fi
          lowest=$(printf '%s\n%s\n' "$version" "$upper" | sort -V | head -n 1)
          echo "newest analyzer $version, validated upper bound <$upper, observation $OBSERVATION"
          if [ "$version" = "$upper" ] || [ "$lowest" != "$version" ]; then
            echo "::error::analyzer $version is outside the validated range (<$upper); the compatibility observation was $OBSERVATION. Validate it with doc/DECISION-analyzer.md before widening the constraint."
            exit 1
          fi

name: impact-precheck

# 변경 영향 사전 점검(`dartograph impact`)을 CI에서 돌리는 예시 워크플로다.
#
# 기본 트리거를 수동(workflow_dispatch)으로 둔 이유: `impact`/`runtime`은 0.9.0에 릴리스됐지만
# 병합 즉시 자동 트리거를 켜면 공용 CI가 이유 없이 붉어질 수 있다. 아래 액션을 SHA로 고정한 뒤
# `pull_request:` 블록의 주석을 풀어 활성화한다.
#
# 증분 분석(`--incremental <dir>`)은 브랜치 `feat/incremental-analysis`에 구현돼 있지만
# 아직 릴리스되지 않았다(0.10.0 후보). 그때까지 이 워크플로의 캐시 대상은 pub 캐시뿐이다.
# 증분이 릴리스되면 분석 캐시 디렉터리를 actions/cache로 저장하고 `--incremental <dir>`을
# 넘기는 단계를 추가한다(캐시 디렉터리는 체크아웃마다 분리한다).
#
# 이 저장소는 서드파티 액션을 커밋 SHA로 고정한다. checkout·setup-dart는 기존 ci.yml과
# 같은 핀을 쓴다. cache·upload-sarif·upload-artifact는 버전 태그로 두었으니 활성화 전에
# SHA 핀으로 바꾼다.

on:
  workflow_dispatch:
  # pull_request:
  #   branches: [main]

concurrency:
  group: impact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.13.3'
      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-
      - run: dart pub get
      - name: Impact (SARIF)
        run: |
          dart run dartograph impact \
            --since origin/${{ github.base_ref || 'main' }} \
            --format sarif --limit 200 . > impact.sarif
        continue-on-error: true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: impact.sarif
      - name: Impact gate (fail on high)
        run: |
          dart run dartograph impact \
            --since origin/${{ github.base_ref || 'main' }} \
            --format github-actions --fail-on high .
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impact-sarif
          path: impact.sarif
          if-no-files-found: warn

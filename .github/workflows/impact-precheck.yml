name: impact-precheck

# 변경 영향 사전 점검(`dartograph impact`)을 CI에서 돌리고 PR에 리포트를 다는 예시
# 워크플로다. 사용자는 이 파일을 복사해 저장소에 맞게 조정한다.
#
# - `--since origin/<base>`로 PR의 변경 파일을 씨앗으로 삼는다. merge-base 계산에
#   전체 Git 이력이 필요하므로 checkout은 fetch-depth: 0이다.
# - `--incremental <dir>`로 분석 사실 캐시를 유지하고(actions/cache), `--record <dir>`로
#   검증 원장을 남긴다. 둘 다 저장소 밖 `runner.temp` 아래에 둔다. 워크스페이스는 PR이
#   고른 내용이다 — 그 안에 미리 커밋해 둔 캐시(위조한 사실은 리포트와 게이트를
#   바꾼다)나 원장 파일을 믿지 않기 위해서다. 리포트·SARIF·게이트 단계가 같은 사실
#   캐시를 써서 단계마다 전체 분석을 다시 하지 않는다.
# - 게이트(`--fail-on high`)는 기본 브랜치에만 건다. PR마다 붉어지면 정책에 맞게
#   `--fail-on`을 완화하거나 게이트 단계를 조정한다.
#
# 이 저장소는 서드파티 액션을 커밋 SHA로 고정한다(변경 시 태그 대신 SHA를 갱신).

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: impact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.13.3'
      - name: Cache pub
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-
      - run: dart pub get
      - name: Cache incremental facts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/dartograph-facts
          key: dartograph-facts-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            dartograph-facts-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-
      - name: Impact report for the PR comment
        if: github.event_name == 'pull_request'
        run: |
          dart run dartograph impact \
            --since "origin/${{ github.base_ref }}" \
            --format markdown --limit 200 \
            --incremental "$RUNNER_TEMP/dartograph-facts" \
            --record "$RUNNER_TEMP/dartograph-ledger" \
            . > impact.md || true
          if [[ ! -s impact.md ]]; then
            printf 'dartograph impact produced no report; see the job log.\n' > impact.md
          fi
      - name: Post or update the PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file impact.md --edit-last \
            || gh pr comment "${{ github.event.pull_request.number }}" \
                 --body-file impact.md
      - name: Impact (SARIF)
        run: |
          dart run dartograph impact \
            --since "origin/${{ github.base_ref || 'main' }}" \
            --format sarif --limit 200 \
            --incremental "$RUNNER_TEMP/dartograph-facts" . > impact.sarif
        continue-on-error: true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: impact.sarif
      - name: Impact gate (fail on high)
        # 게이트는 기본 브랜치(push·수동)에서만 건다. PR에서는 리포트·SARIF만
        # 남기고 체크를 붉게 만들지 않는다 — 정책에 맞게 조건을 바꾼다.
        if: github.event_name != 'pull_request'
        run: |
          dart run dartograph impact \
            --since "origin/${{ github.base_ref || 'main' }}" \
            --format github-actions --fail-on high \
            --incremental "$RUNNER_TEMP/dartograph-facts" .
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: impact-report
          path: |
            impact.md
            impact.sarif
          if-no-files-found: warn
      # 원장은 워크스페이스 밖이라 따로 올린다 — 한 아티팩트에 섞으면 경로들의 공통
      # 조상이 아티팩트 루트가 되어 리포트 파일의 경로 모양이 바뀐다.
      - name: Upload ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: impact-ledger
          path: ${{ runner.temp }}/dartograph-ledger/ledger.jsonl
          if-no-files-found: warn
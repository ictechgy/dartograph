name: dartograph
description: Evidence-backed dependency graph analysis for Dart and Flutter codebases.
version: 0.4.0
homepage: https://pub.dev/packages/dartograph
repository: https://github.com/ictechgy/dartograph
issue_tracker: https://github.com/ictechgy/dartograph/issues

topics:
  - analysis
  - cli
  - dependencies
  - flutter
  - graph

environment:
  sdk: ^3.11.0

dependencies:
  analyzer: '>=14.3.0 <14.4.0'
  crypto: ^3.0.7
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  coverage: ^1.15.0
  lints: ^6.0.0
  test: ^1.26.0

executables:
  dartograph:
